name: Publish Go module

# This workflow runs on git tag pushes (v*).
# For Go modules, publishing a tag is sufficient for module discovery.
# This workflow validates the module and creates a GitHub Release (if not present).
on:
    push:
        tags:
            - "v*"

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v4
              with:
                  go-version: "1.24"

            - name: Cache Go modules
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cache/go-build
                      ${{ env.GOMODCACHE }}
                  key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
                  restore-keys: |
                      ${{ runner.os }}-go-

            - name: Ensure modules tidy
              run: |
                  go mod tidy
                  git status --porcelain

            - name: Lint (go vet)
              run: go vet ./...

            - name: Run tests
              run: go test ./... -v

            - name: Create GitHub Release
              id: create_release
              uses: actions/create-release@v1
              with:
                  tag_name: ${{ github.ref_name }}
                  release_name: ${{ github.ref_name }}
                  body: "Release ${{ github.ref_name }} — automated module publish (tag push)."
                  draft: false
                  prerelease: false
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
