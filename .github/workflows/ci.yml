name: CI

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v4
              with:
                  go-version: "1.24"

            - name: Cache Go modules
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cache/go-build
                      ${{ env.GOMODCACHE }}
                  key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
                  restore-keys: |
                      ${{ runner.os }}-go-

            - name: Configure GOPROXY
              run: |
                  go env -w GOPROXY=https://proxy.golang.org,direct

            - name: Lint (go vet)
              run: go vet ./...

            - name: Run tests
              run: go test ./... -v

            - name: Build all packages
              run: go build ./...
